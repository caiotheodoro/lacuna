[project]
name = "lacuna"
version = "0.0.0"
description = "Estimates how many consequential agent actions are missing from the trace, by capture-recapture over independent-ish witnesses."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Caio Theodoro" }]
dependencies = ["numpy>=1.26", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/caiotheodoro/lacuna"
Dataset = "https://huggingface.co/datasets/caiotheodoro/lacuna-capture-histories"

[dependency-groups]
# statsmodels is a cross-check only: the estimator never imports it.
dev = ["pytest>=8", "ruff>=0.5", "statsmodels>=0.14"]
# Only for scripts/{build,validate,publish}_dataset.py: `datasets` loads every
# config the card declares, as the Hub viewer would. `validate` never needs it.
dataset = ["datasets>=3.0", "huggingface_hub>=0.25", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lacuna"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# uv's editable .pth gets the macOS `hidden` flag and Python 3.13 skips
# hidden .pth files, so the install alone is not enough on this machine.
pythonpath = ["src"]
