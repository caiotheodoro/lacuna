[project]
# The distribution is `lacuna-mse`: the name `lacuna` on PyPI is someone else's.
# The import package and the command stay `lacuna`.
name = "lacuna-mse"
version = "1.0.0rc1"
description = "Estimates how many agent actions no log recorded, by capture-recapture over several logs of the same system."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Caio Theodoro" }]
keywords = [
    "capture-recapture",
    "multiple systems estimation",
    "agents",
    "audit",
    "logs",
    "telemetry",
    "opentelemetry",
    "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# The LLM agent and auditor (lacuna.agents.llm). The estimator never imports it.
agents = ["httpx>=0.27"]
# The study-5 rig (lacuna.rig.front, lacuna.rig.replay): an MCP server and client and
# the OpenTelemetry SDK. `mcp` 2.x renamed the 1.x API the rig is written against.
rig = [
    "mcp>=1.30,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
]

[project.scripts]
lacuna = "lacuna.cli:main"

[project.urls]
Homepage = "https://github.com/caiotheodoro/lacuna"
Repository = "https://github.com/caiotheodoro/lacuna"
Documentation = "https://github.com/caiotheodoro/lacuna/blob/main/docs/GUIDE.md"
Issues = "https://github.com/caiotheodoro/lacuna/issues"
Changelog = "https://github.com/caiotheodoro/lacuna/blob/main/docs/DECISIONS.md"
Dataset = "https://huggingface.co/datasets/caiotheodoro/lacuna-capture-histories"

[dependency-groups]
# statsmodels is a cross-check only: the estimator never imports it.
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "statsmodels>=0.14",
    "httpx>=0.27",
    # The rig extra, so its hermetic tests (in-memory MCP transport, in-memory span
    # exporter) run in `make validate`.
    "mcp>=1.30,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
]
# Only for scripts/{build,validate,publish}_dataset.py: `datasets` loads every
# config the card declares, as the Hub viewer would. `validate` never needs it.
dataset = ["datasets>=3.0", "huggingface_hub>=0.25", "pyyaml>=6"]
# Only for scripts/paper_figures.py, which `make paper` runs before tectonic.
paper = ["matplotlib>=3.8"]

[build-system]
# 1.27 is the first hatchling that writes `license` as an SPDX expression (PEP 639).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The wheel is the package and nothing else. Core metadata is held at 2.4, the version
# that carries the SPDX licence; nothing here needs a later one, and an index or an
# installer that does not read a later one yet would refuse or misread the files.
[tool.hatch.build.targets.wheel]
packages = ["src/lacuna"]
core-metadata-version = "2.4"

# The sdist is the package's source and the guide, with what the metadata names
# (README, LICENSE, NOTICE). The studies stay in the repository: artifacts/, paper/,
# scripts/, rig/ and tests/ are not in it, so the tests do not run from an sdist.
[tool.hatch.build.targets.sdist]
only-include = ["src/lacuna", "docs/GUIDE.md"]
core-metadata-version = "2.4"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# uv's editable .pth gets the macOS `hidden` flag and Python 3.13 skips
# hidden .pth files, so the install alone is not enough on this machine.
pythonpath = ["src"]
