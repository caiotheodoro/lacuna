name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      # The only step that touches the network. `make validate` runs offline,
      # needs no API key, and skips what needs tectonic or docker.
      - name: Install
        run: make install

      - name: Validate
        run: make validate
